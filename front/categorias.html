<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorías - Gestión Educativa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <nav class="navbar fixed-top navbar-expand-lg navbar-glass">
    <div class="container-fluid">
      <a class="navbar-brand brand-logo" href="index.html">Gestión Educativa</a>
      <ul class="navbar-nav d-flex flex-row gap-3">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="estudiantes.html">Estudiantes</a></li>
        <li class="nav-item"><a class="nav-link" href="carreras.html">Carreras</a></li>
        <li class="nav-item"><a class="nav-link active" href="categorias.html">Categorías</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
      </ul>
    </div>
  </nav>

  <main class="pt-5 mt-4 container">
    <h1 class="section-title">Gestión de Categorías</h1>

    <div class="card card-modern mb-4">
      <div class="card-header-modern">
        <h5 class="card-title mb-0">Registrar Nueva Categoría</h5>
      </div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-8">
            <div class="form-floating">
              <input type="text" id="registerName" class="form-control" placeholder="Nombre de categoría" required>
              <label for="registerName">Nombre de categoría</label>
            </div>
          </div>
          <div class="col-md-4 d-flex align-items-end">
            <button id="registerBtn" class="btn btn-primary w-100">
              <i class="bi bi-save"></i> Registrar
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="card card-modern">
      <div class="card-body">
        <h5 class="card-title">Categorías Registradas</h5>
        <div class="table-responsive">
          <table class="table table-modern table-hover">
            <thead>
              <tr>
                <th width="15%">ID</th>
                <th>Nombre</th>
                <th width="15%" class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="categoriesTableBody">
              <!-- Dinámico -->
              <tr>
                <td colspan="3" class="text-center text-muted">No hay categorías registradas.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
