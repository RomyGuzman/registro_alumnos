<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorías - Campus360</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <!-- Navbar Unificada para TODAS las páginas -->
  <nav class="navbar navbar-expand-lg fixed-top navbar-glass">
    <div class="container">
      <a class="navbar-brand brand-logo" href="index.html">
        <i class="bi bi-mortarboard"></i>
        <span>Campus360</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto d-flex flex-row gap-2">
          <li class="nav-item">
            <a class="nav-link {INICIO_ACTIVE}" href="index.html">
              <i class="bi bi-house-door me-1"></i> Inicio
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {ESTUDIANTES_ACTIVE}" href="estudiantes.html">
              <i class="bi bi-people me-1"></i> Estudiantes
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {CARRERAS_ACTIVE}" href="carreras.html">
              <i class="bi bi-book me-1"></i> Carreras
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {CATEGORIAS_ACTIVE}" href="categorias.html">
              <i class="bi bi-tags me-1"></i> Categorías
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5 mt-4">
    <h1 class="section-title">Gestión de Categorías</h1>

    <!-- Tarjeta de Registro de Categoría -->
    <div class="card card-modern mb-4">
      <div class="card-header-modern">
        <h5 class="card-title mb-0"><i class="bi bi-plus-circle me-2"></i> Registrar Nueva Categoría</h5>
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-md-8">
            <div class="form-floating">
              <input type="text" id="registerName" class="form-control" placeholder="Nombre de categoría" required>
              <label for="registerName">Nombre de categoría</label>
            </div>
          </div>
          <div class="col-md-4 d-flex align-items-end">
            <button id="registerBtn" class="btn btn-primary w-100">
              <i class="bi bi-save me-2"></i> Registrar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tarjeta de Filtros -->
    <div class="card card-modern mb-4">
      <div class="card-header-modern">
        <h5 class="card-title mb-0"><i class="bi bi-funnel me-2"></i> Filtrar Categorías</h5>
      </div>
      <div class="card-body">
        <form id="filterCategoryForm" class="row g-3 align-items-end">
          <div class="col-md-8">
            <div class="form-floating">
              <input type="text" id="filterCategoryName" class="form-control" placeholder="Nombre de categoría">
              <label for="filterCategoryName">Nombre de categoría</label>
            </div>
          </div>
          <div class="col-md-4 d-flex align-items-end">
            <button type="submit" class="btn btn-outline-primary w-100">
              <i class="bi bi-search me-2"></i> Filtrar
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Tarjeta de Categorías Registradas -->
    <div class="card card-modern">
      <div class="card-body">
        <h5 class="card-title"><i class="bi bi-tags me-2"></i> Categorías Registradas</h5>
        <div class="table-responsive">
          <table class="table table-modern table-hover">
            <thead>
              <tr>
                <th width="15%">ID</th>
                <th>Nombre</th>
                <th width="15%" class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="categoriesTableBody">
              <tr>
                <td colspan="3" class="text-center text-muted py-4">
                  <i class="bi bi-tags display-6 d-block mb-2"></i>
                  No hay categorías registradas
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
