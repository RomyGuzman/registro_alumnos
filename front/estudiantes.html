<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudiantes - Campus360</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <!-- Navbar Unificada para TODAS las páginas -->
  <nav class="navbar navbar-expand-lg fixed-top navbar-glass">
    <div class="container">
      <a class="navbar-brand brand-logo" href="index.html">
        <i class="bi bi-mortarboard"></i>
        <span>Campus360</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto d-flex flex-row gap-2">
          <li class="nav-item">
            <a class="nav-link {INICIO_ACTIVE}" href="index.html">
              <i class="bi bi-house-door me-1"></i> Inicio
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {ESTUDIANTES_ACTIVE}" href="estudiantes.html">
              <i class="bi bi-people me-1"></i> Estudiantes
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {CARRERAS_ACTIVE}" href="carreras.html">
              <i class="bi bi-book me-1"></i> Carreras
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {CATEGORIAS_ACTIVE}" href="categorias.html">
              <i class="bi bi-tags me-1"></i> Categorías
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5 mt-4">
    <h1 class="section-title">Gestión de Estudiantes</h1>

    <!-- Tarjeta de Registro -->
    <div class="card card-modern mb-4">
      <div class="card-header-modern">
        <h5 class="card-title mb-0"><i class="bi bi-person-plus me-2"></i> Nuevo Registro</h5>
      </div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-6">
            <div class="form-floating">
              <input type="text" class="form-control" id="registerName" placeholder="Nombre" required>
              <label for="registerName"><i class="bi bi-person me-1"></i> Nombre completo</label>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-floating">
              <select class="form-select" id="registerCareer" required>
                <option value="" selected disabled>Seleccione una carrera...</option>
              </select>
              <label for="registerCareer"><i class="bi bi-mortarboard me-1"></i> Carrera</label>
            </div>
          </div>
          <div class="col-md-3">
            <div class="form-floating">
              <input type="number" class="form-control" id="registerEdad" placeholder="Edad" min="15" max="80" required>
              <label for="registerEdad"><i class="bi bi-calendar3 me-1"></i> Edad</label>
            </div>
          </div>
          <div class="col-md-3">
            <div class="form-floating">
              <input type="text" class="form-control" id="registerDNI" placeholder="DNI" pattern="\d{8,10}" required>
              <label for="registerDNI"><i class="bi bi-card-text me-1"></i> DNI</label>
            </div>
          </div>
          <div class="col-md-6 d-flex align-items-end">
            <button type="button" class="btn btn-primary w-100" onclick="registerStudent()">
              <i class="bi bi-check-lg me-2"></i> Registrar Estudiante
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Panel de Filtros -->
    <div class="card card-modern mb-4">
      <div class="card-body">
        <h5 class="mb-3"><i class="bi bi-funnel me-2"></i> Filtrar Estudiantes</h5>
        <div class="row g-3 align-items-end">
          <div class="col-md-6">
            <div class="form-floating">
              <input type="text" class="form-control" id="searchInput" placeholder="Buscar">
              <label for="searchInput"><i class="bi bi-search me-1"></i> Buscar estudiantes</label>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-floating">
              <select class="form-select" id="filterCareer">
                <option value="">Todas las carreras</option>
              </select>
              <label for="filterCareer"><i class="bi bi-mortarboard me-1"></i> Filtrar por carrera</label>
            </div>
          </div>
          <div class="col-md-2 d-grid">
            <button class="btn btn-secondary" onclick="loadStudentsTable()">
              <i class="bi bi-funnel-fill me-1"></i> Aplicar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Listado de Estudiantes -->
    <div class="card card-modern">
      <div class="card-header-modern d-flex justify-content-between align-items-center">
        <h5 class="card-title mb-0"><i class="bi bi-people-fill me-2"></i> Listado de Estudiantes</h5>
        <span class="badge bg-primary rounded-pill">Total: <span id="totalStudents">0</span></span>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-modern">
            <thead>
              <tr>
                <th width="5%">ID</th>
                <th width="25%">Estudiante</th>
                <th width="25%">Carrera</th>
                <th width="10%">Edad</th>
                <th width="15%">DNI</th>
                <th width="10%">Acciones</th>
              </tr>
            </thead>
            <tbody id="studentsTableBody">
              <tr>
                <td colspan="6" class="text-center py-4 text-muted">
                  <i class="bi bi-people display-6 d-block mb-2"></i>
                  No hay estudiantes registrados
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="card-footer bg-light d-flex justify-content-between align-items-center">
        <div class="text-muted">
          Mostrando <span id="showingCount">0</span> de <span id="totalCount">0</span> estudiantes
        </div>
        <div>
          <button class="btn btn-sm btn-outline-primary me-1" disabled>
            <i class="bi bi-chevron-left"></i>
          </button>
          <button class="btn btn-sm btn-outline-primary" disabled>
            <i class="bi bi-chevron-right"></i>
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
