  <main class="container py-5 mt-4">
    <h1 class="section-title">Gestión de Carreras</h1>

    <!-- Formulario de registro de carrera -->
    <div class="card card-modern mb-4 shadow-sm">
      <div class="card-header-modern">
        <h5 class="card-title mb-0"><i class="bi bi-plus-circle me-2"></i> Registrar Nueva Carrera</h5>
      </div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4">
            <div class="form-floating">
              <input type="text" id="registerName" class="form-control" placeholder="Nombre de la carrera" required>
              <label for="registerName">Nombre de la carrera</label>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-floating">
              <input type="text" id="registerDuration" class="form-control" placeholder="Duración (años)" required>
              <label for="registerDuration">Duración (años)</label>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-floating">
              <select id="registerCategory" class="form-select" required>
                <option value="" disabled selected>Seleccione categoría</option>
                <!-- Las opciones se cargan dinámicamente -->
              </select>
              <label for="registerCategory">Categoría</label>
            </div>
          </div>
        </div>
        <div class="row mt-3">
          <div class="col text-end">
            <button class="btn btn-primary px-4 py-2" onclick="CareerUI.handleRegister()">
              <i class="bi bi-save me-2"></i> Registrar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tarjeta de Filtros -->
    <div class="card card-modern mb-4">
      <div class="card-header-modern">
        <h5 class="card-title mb-0"><i class="bi bi-funnel me-2"></i> Filtrar Carreras</h5>
      </div>
      <div class="card-body">
        <form id="filterCareerForm" class="row g-3 align-items-end">
          <div class="col-md-4">
            <div class="form-floating">
              <input type="text" id="filterCareerName" class="form-control" placeholder="Nombre de la carrera">
              <label for="filterCareerName">Nombre de la carrera</label>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-floating">
              <input type="text" id="filterCareerDuration" class="form-control" placeholder="Duración">
              <label for="filterCareerDuration">Duración</label>
            </div>
          </div>
          <div class="col-md-4 d-flex align-items-end">
            <button type="submit" class="btn btn-outline-primary w-100">
              <i class="bi bi-search me-2"></i> Filtrar
            </button>
          </div>
        </form>
      </div>
    </div>

      <div class="card-body">
        <h5 class="card-title"><i class="bi bi-list-ul me-2"></i> Carreras Registradas</h5>
        <div class="table-responsive">
          <table class="table table-modern table-hover">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Duración</th>
                <th>Categoría</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="careersTableBody">
              <tr>
                <td colspan="5" class="text-center text-muted py-4">
                  <i class="bi bi-book display-6 d-block mb-2"></i>
                  No hay carreras registradas
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
