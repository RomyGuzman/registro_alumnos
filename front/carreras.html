<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carreras - Gestión Educativa</title>
  <!-- Bootstrap CSS para estilos rápidos y responsivos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Iconos de Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="styles.css">
  <!-- SweetAlert2 para mensajes emergentes bonitos -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <!-- Barra de navegación superior -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">Gestión Educativa</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <!-- Enlaces de navegación -->
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="estudiantes.html">Estudiantes</a></li>
          <li class="nav-item"><a class="nav-link active" href="carreras.html">Carreras</a></li>
          <li class="nav-item"><a class="nav-link" href="categorias.html">Categorías</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container main-container">
    <!-- Título principal de la página -->
    <h1 class="mb-3">Gestión de Carreras</h1>

    <!-- Formulario para registrar una nueva carrera -->
    <div class="card form-container">
      <div class="card-header">
        <h5 class="card-title">Registrar Nueva Carrera</h5>
      </div>
      <div class="card-body">
        <div class="row g-3">
          <!-- Campo para el nombre de la carrera -->
          <div class="col-md-4">
            <div class="form-floating">
              <input type="text" class="form-control" id="registerName" placeholder="Nombre">
              <label for="registerName">Nombre</label>
            </div>
          </div>
          <!-- Campo para la duración de la carrera -->
          <div class="col-md-3">
            <div class="form-floating">
              <input type="number" class="form-control" id="registerDuration" placeholder="Duración" min="1" max="10">
              <label for="registerDuration">Duración (años)</label>
            </div>
          </div>
          <!-- Selector de categoría para la carrera -->
          <div class="col-md-3">
            <div class="form-floating">
              <select class="form-select" id="registerCategory">
                <option value="" selected disabled>Seleccione una categoría</option>
              </select>
              <label for="registerCategory">Categoría</label>
            </div>
          </div>
          <!-- Botón para registrar la carrera -->
          <div class="col-md-2 d-flex align-items-end">
            <button type="button" class="btn btn-primary w-100" onclick="CareerUI.handleRegister()">
              <i class="bi bi-save"></i> Registrar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Filtros de búsqueda para carreras -->
    <div class="card mb-4">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Filtros de Búsqueda</h5>
      </div>
      <div class="card-body py-2">
        <div class="row g-2">
          <!-- Campo para buscar por nombre de carrera -->
          <div class="col-md-6">
            <div class="form-floating mb-2">
              <input type="text" class="form-control form-control-sm" id="searchCareerInput" placeholder="Buscar">
              <label for="searchCareerInput">Buscar por nombre de carrera</label>
            </div>
          </div>
          <!-- Botón para aplicar el filtro -->
          <div class="col-md-2 d-flex align-items-end">
            <button class="btn btn-sm btn-primary w-100" onclick="filterCareers()">
              <i class="bi bi-filter"></i> Filtrar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabla que muestra el listado de carreras registradas -->
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="card-title">Listado de Carreras</h5>
        <!-- Botón para actualizar la lista de carreras -->
        <button class="btn btn-sm btn-outline-secondary" onclick="CareerUI.loadCareers()">
          <i class="bi bi-arrow-repeat"></i> Actualizar
        </button>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead>
              <tr>
                <th width="10%">ID</th>
                <th width="30%">Nombre</th>
                <th width="20%">Duración</th>
                <th width="30%">Categoría</th>
                <th width="10%" class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="careersTableBody">
              <!-- Aquí se cargan dinámicamente las filas de carreras -->
              <tr>
                <td colspan="5" class="text-center py-4">
                  <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Cargando...</span>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap JS para componentes interactivos -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Script principal de la aplicación -->
  <script src="app.js"></script>
</body>
</html>
