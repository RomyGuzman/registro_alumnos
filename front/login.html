<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Gestión Educativa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <nav class="navbar fixed-top custom-navbar">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">Gestión Educativa</a>
      <ul class="navbar-nav d-flex flex-row gap-3">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="estudiantes.html">Estudiantes</a></li>
        <li class="nav-item"><a class="nav-link" href="carreras.html">Carreras</a></li>
        <li class="nav-item"><a class="nav-link" href="categorias.html">Categorías</a></li>
        <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
      </ul>
    </div>
  </nav>

  <main class="pt-5 mt-4 container d-flex justify-content-center">
    <div class="card" style="width: 100%; max-width: 400px;">
      <div class="card-header bg-secondary text-white">
        <h5 class="card-title mb-0 text-center">Iniciar sesión</h5>
      </div>
      <div class="card-body">
        <div class="form-floating mb-3">
          <input id="loginUser " class="form-control" type="text" placeholder="Usuario" autocomplete="username" required>
          <label for="loginUser ">Usuario</label>
        </div>
        <div class="form-floating mb-3">
          <input id="loginPassword" class="form-control" type="password" placeholder="Contraseña" autocomplete="current-password" required>
          <label for="loginPassword">Contraseña</label>
        </div>
        <div class="d-flex justify-content-end">
          <button class="btn btn-primary w-100" onclick="loginUser ()">
            <i class="bi bi-lock"></i> Iniciar sesión
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
